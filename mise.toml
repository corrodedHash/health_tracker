# Task runner for health_tracker. The Rust toolchain itself is pinned via
# rust-toolchain.toml (rustup-native); mise handles tasks plus a couple of
# auxiliary dev tools (not the compiler).
# Run `mise tasks` to list, `mise run <task>` to execute.
#
# ── Dev workflows ──────────────────────────────────────────────────────────────
#   mise run dev              Full stack: Postgres + Dex OIDC + web server
#   mise run run-web          Lightweight: Postgres + web server (auto-login, no OIDC)
#   mise run frontend-dev     Vite dev server (run in a separate terminal)
#   mise run run-bot          Matrix bot (needs Synapse running, see ensure-synapse)
#   mise run test             Test suite (needs Postgres)
#   mise run regenerate-sqlx  Refresh SQLx offline cache after schema changes
#
# ── Local overrides ────────────────────────────────────────────────────────────
# Create .mise.local.toml to override any env/task without modifying this file.
# See the template in .mise.local.toml for available options.

[tools]
# Git hook manager — runs repo-integrity checks and linters.
hk = "1"

[env]
# Tight mise integration: wraps hk hooks with `mise x` so tools are in PATH.
HK_MISE = "1"
DATABASE_URL = "postgres://health:health@localhost:5432/health"

[tasks.build]
description = "Build the debug binaries (health-web, health-bot)"
run = "cargo build"

[tasks.release]
description = "Build the optimized release binaries"
run = "cargo build --release"

[tasks.ensure-debug-database]
description = "Start a --rm PostgreSQL if one isn't already running on localhost:5432"
run = "./tools/ensure-debug-database.sh"

[tasks.regenerate-sqlx]
description = "Regenerate the sqlx offline query cache using a per-branch database to avoid worktree conflicts"
depends = ["ensure-debug-database"]
run = "./tools/regenerate-sqlx.sh"

[tasks.ensure-oidc]
description = "Start a --rm Dex OIDC provider if one isn't already running on localhost:5556"
run = "./tools/ensure-oidc.sh"

[tasks.run-web]
description = "Run the web server (pass args after --, per-branch database)"
env = { HEALTH__COOKIE_KEY = "b747717c6d3469963357b32b541548b95536b3eb365edd7aebdba44c707407881a9a5dbeec995e0502f03a434e00d6be661fdd02c61ae2925bd492b6d604bc8e", HEALTH__DEV_AUTO_LOGIN = "true" }
run = "./tools/run-web.sh"

[tasks.run-web-oidc]
description = "Run the web server with a real OIDC provider (Dex in Docker) — uses per-branch database"
depends = ["ensure-debug-database", "ensure-oidc"]
env = { HEALTH__COOKIE_KEY = "b747717c6d3469963357b32b541548b95536b3eb365edd7aebdba44c707407881a9a5dbeec995e0502f03a434e00d6be661fdd02c61ae2925bd492b6d604bc8e", HEALTH__OIDC__ISSUER_URL = "http://localhost:5556/dex", HEALTH__OIDC__CLIENT_ID = "health-tracker", HEALTH__OIDC__CLIENT_SECRET = "dev-secret", HEALTH__OIDC__REDIRECT_URI = "http://localhost:5173/api/auth/callback", HEALTH__FRONTEND_URL = "http://localhost:5173" }
run = "./tools/run-web.sh"

[tasks.dev]
description = "Start the full dev environment (Postgres + Dex + web server with OIDC and per-branch database)"
depends = ["ensure-debug-database", "ensure-oidc"]
env = { HEALTH__COOKIE_KEY = "b747717c6d3469963357b32b541548b95536b3eb365edd7aebdba44c707407881a9a5dbeec995e0502f03a434e00d6be661fdd02c61ae2925bd492b6d604bc8e", HEALTH__OIDC__ISSUER_URL = "http://localhost:5556/dex", HEALTH__OIDC__CLIENT_ID = "health-tracker", HEALTH__OIDC__CLIENT_SECRET = "dev-secret", HEALTH__OIDC__REDIRECT_URI = "http://localhost:5173/api/auth/callback", HEALTH__FRONTEND_URL = "http://localhost:5173" }
run = "./tools/run-web.sh"

[tasks.run-bot]
description = "Run the Matrix bot (auto-starts Synapse; pass args after --)"
depends = ["ensure-synapse"]
run = "cargo run -p health-bot --"

[tasks.ensure-synapse]
description = "Start a local Synapse container and generate config/local.toml for Matrix bot E2E testing"
run = "./tools/ensure-synapse.sh"

[tasks.test]
description = "Run the test suite"
depends = ["ensure-debug-database"]
run = "cargo test --all-features"
